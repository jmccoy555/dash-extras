# Reads the AUX/leisure battery's own built-in JBD BMS directly on the ESP,
# instead of the Rock5B polling it over its own Bluetooth (which shares an
# adapter with Android Auto's phone connection and has proven unreliable
# running both at once - see dash-gui's JbdBmsPoller). The ESP has its own
# separate BLE radio, so this doesn't compete with the Rock5B for anything.
#
# *** REAL RISK: this uses ble_client, an ACTIVE BLE connection (connect,
# subscribe, write) - broadly the same class of workload as the Victron BLE
# decryption that was confirmed, live, to cause severe Modbus bus
# corruption when enabled on this same ESP (that's why Victron support was
# reverted entirely). Watch the Modbus log closely after flashing for
# "Clearing buffer" / garbled frames the same way the Victron test was
# checked - if it corrupts the bus, revert immediately (comment the include
# back out in defender-main.yaml), same as Victron.
#
# MAC address is the same one already in dash-gui's victron_secrets.py
# (AUX_BATTERY_BMS_MAC) - not a real secret (this protocol isn't
# encrypted), but kept out of this tracked file for consistency; fill in
# secrets.yaml as bms_mac_address.
external_components:
  - source: github://syssi/esphome-jbd-bms@main

ble_client:
  - mac_address: !secret bms_mac_address
    id: aux_battery_bms

# The actual component is jbd_bms_ble (a separate component from plain
# jbd_bms, which doesn't take a ble_client at all) - confirmed against the
# real component source on the ESPHome host after an earlier pass guessed
# this wrong ("ble_client_id is an invalid option for jbd_bms").
jbd_bms_ble:
  - id: aux_battery_jbd_ble
    ble_client_id: aux_battery_bms
    update_interval: 30s

sensor:
  - platform: jbd_bms_ble
    jbd_bms_ble_id: aux_battery_jbd_ble
    total_voltage:
      id: bms_voltage
      name: "AUX Battery Voltage"
    current:
      id: bms_current
      name: "AUX Battery Current"
    capacity_remaining:
      id: bms_capacity_remaining
      name: "AUX Battery Capacity Remaining"
    state_of_charge:
      id: bms_soc
      name: "AUX Battery SOC"

# Not a real JBD BMS value - this component doesn't expose one (checked its
# supported sensor keys directly, no time-to-go/runtime field exists) - so
# computed here the standard way: remaining capacity (Ah) / discharge
# current (A). bms_current's sign convention is negative while discharging
# (see the interval push below), so only that side is meaningful; charging
# or ~idle has no sensible "time to empty" and shows as such instead of a
# nonsense number.
text_sensor:
  - platform: template
    name: "AUX Battery Time To Go"
    id: bms_ttg
    icon: mdi:timer-sand
    update_interval: 30s
    lambda: |-
      float current = id(bms_current).state;
      if (current >= -0.05) {
        return current > 0.05 ? std::string("Charging") : std::string("Idle");
      }
      float hours = id(bms_capacity_remaining).state / (-current);
      int hrs = (int) hours;
      int mins = (int) ((hours - hrs) * 60);
      char buffer[16];
      sprintf(buffer, "%dh %dm", hrs, mins);
      return std::string(buffer);

# Pushed to dash as registers 4-7 (1-3 are outside/inside temp and
# humidity, see modbus-dash.yaml), *100 scaled like those - current can be
# negative (discharging) so dash's side must decode it as int16, not
# uint16. NOT actually piggybacking on modbus-dash.yaml's register push
# despite matching its interval value (an earlier comment here claimed it
# did - it doesn't; this is its own separate interval: block/timer) - so it
# was a genuine third competitor for the bus, not sharing a turn with that
# one. Bumped 5s -> 8s alongside modbus-dash.yaml's two pushes, same
# reasoning: freshness doesn't matter here, button responsiveness does.
interval:
  - interval: 8s
    then:
      - modbus_client.write_multiple_registers:
          address: 5
          start_address: 4
          values: !lambda |-
            return std::vector<uint16_t>{
              (uint16_t) (id(bms_voltage).state * 100),
              (uint16_t) (int16_t) (id(bms_current).state * 100),
              (uint16_t) (id(bms_soc).state * 100),
              (uint16_t) (id(bms_capacity_remaining).state * 100),
            };
