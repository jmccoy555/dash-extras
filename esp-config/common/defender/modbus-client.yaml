# Everything on the ESP's own client/master role - the real devices it polls
# itself. dash never talks to any of these addresses directly; it only
# talks to the ESP (see the dash-gui project), which keeps this bus down to
# a single master instead of dash mastering some devices independently.
modbus_controller:
  - id: sht20
    address: 9
    modbus_id: bus_client
    setup_priority: -10
    update_interval: 30s
  # - id: client_10_1s
  #   address: 10
  #   modbus_id: bus_client
  #   setup_priority: -10
  #   update_interval: 1s
  - id: client_10
    address: 10
    modbus_id: bus_client
    setup_priority: -10
    update_interval: 2s
  - id: client_20
    address: 20
    modbus_id: bus_client
    setup_priority: -10
    update_interval: 5s
  # The rear window relay board - left/right, up/down.
  - id: client_30
    address: 30
    modbus_id: bus_client
    setup_priority: -10
    update_interval: 5s

sensor:
  - platform: modbus_controller
    modbus_controller_id: sht20
    name: "Temperature Front"
    id: temp_inside
    register_type: read
    address: 0x0001
    unit_of_measurement: "°C"
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    web_server:
      sorting_group_id: sorting_group_sensors

  - platform: modbus_controller
    modbus_controller_id: sht20
    name: "Humidity Front"
    id: humid_inside
    register_type: read
    address: 0x0002
    unit_of_measurement: "%"
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    web_server:
      sorting_group_id: sorting_group_sensors

binary_sensor:
