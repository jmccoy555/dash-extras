  # Rear power (a real toggle, like req_window_front_power) and the
  # combined rear up/down (momentary, like the front ones) - contiguous
  # right after 156 so these extend the same merged read again.
  - platform: modbus_controller
    modbus_controller_id: client_dash_requests
    id: req_rear_power
    internal: true
    register_type: coil
    address: 157
    on_state:
      - lambda: |-
          if (!id(req_gui_ready).state) return;
          if (x) id(rear_power).turn_on();
          else id(rear_power).turn_off();
  - platform: modbus_controller
    modbus_controller_id: client_dash_requests
    id: req_rear_up
