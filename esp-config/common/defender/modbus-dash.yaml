# The ESP's connection to dash itself. dash runs as a genuine Modbus slave
# (see the dash-gui project) - the ESP is the bus's only master, including
# of dash, rather than dash mastering the ESP.
#
# Status pushes to dash (sensor readings, relay/light state) use the
# modbus_client component (ad-hoc request/response) below, since that's
# pushing arbitrary values on a timer rather than declaring persistent
# entities. Polling dash's request coils (button presses) further down
# uses modbus_controller instead - see the comment there for why.
modbus_client:
  - id: client_dash
    address: 5
    modbus_id: bus_client

# Blocks req_inverter_power's on_state handler for a few seconds after boot,
# so a poll landing before modbus-client.yaml's on_boot clear-write reaches
# dash can't read the inverter's stale pre-reboot request coil and turn it
# straight back on (see the on_boot comment there).
globals:
  - id: dash_boot_guard_inverter
    type: bool
    restore_value: false
    initial_value: 'true'

interval:
  # Push sensor readings to dash - it only ever reads these locally now.
  - interval: 5s
    then:
      - modbus_client.write_multiple_registers:
          address: 5
          start_address: 1
          values: !lambda |-
            return std::vector<uint16_t>{
              (uint16_t) id(temperature_outside).state,
              (uint16_t) (id(temp_inside).state * 10),
              (uint16_t) (id(humid_inside).state * 10),
            };

  # Push current relay/light state to dash as ONE write covering the whole
  # 10-52 status range (unused gaps just padded with false), mirroring how
  # the read_coils poll below already reads one contiguous 43-coil block.
  #
  # Was 4 separate write_multiple_coils calls (10/20/40/50) with 150ms
  # delays between them. Confirmed live that even with the delays, those 4
  # transactions to address 5 every 1.5s were still colliding with the
  # 300ms read_coils poll and 5s register push - "Frame already active for
  # 5" refusals piling up and the read poll never getting a turn at all
  # (zero read transactions ever seen on the wire). A single transaction
  # per push cycle leaves far more room on the bus for the read poll and
  # the register push. Status doesn't need to be sub-second fresh; button
  # responsiveness does.
  #
  # Bumped 1500ms -> 4000ms: even as one consolidated write, this was still
  # winning a turn on the bus almost every single cycle while the (also
  # consolidated into one read) button-request poll below only got through
  # roughly once every ~15s - the two writes were crowding out the read far
  # more than their fair share. Status can afford to be slower; buttons
  # can't.
  - interval: 4000ms
    then:
      - modbus_client.write_multiple_coils:
          address: 5
          start_address: 10
          values: !lambda |-
            return std::vector<bool>{
              id(worklight_passanger_side).state,
              id(worklight_drivers_side).state,
              id(worklight_rear).state,
              id(worklight_bonnet).state,
              id(headlights_auto).state,
              id(sidelights_auto).state,
              id(service_mode).state,
              false, false, false,
              id(lightbar_main).state,
              id(lightbar_inner).state,
              id(lightbar_outer).state,
              id(lightbar_white).state,
              id(lightbar_amber).state,
              id(lightbar_auto_main).state,
              id(lightbar_auto_amber).state,
              id(lightbar_auto_white).state,
              // 28, 29: unused. 30: window_front_power - a real on/off
              // switch (unlike 31-36, the momentary window buttons, which
              // have no persistent state to push). This was just `false`
              // before - never reflecting the real switch, so dash's
              // status coil for it stayed permanently stuck off and the
              // optimistic click style reverted to grey once the
              // pending-click grace window ran out.
              // 31-39: unused (window buttons + padding to 40).
              false, false,
              id(window_front_power).state,
              false, false, false, false, false, false, false, false, false,
              id(inverter_power).state,
              id(charger_1).state,
              id(charger_2).state,
              id(suspension_handbrake).state,
              id(suspension_power).state,
              id(dash_shutdown_request).state,
              id(james_fob).state,
              id(james_phone).state,
              false, false,
              id(suspension_service).state,
              id(low_box).state,
              id(diff_lock).state,
              // 53-56: unused (individual rear window presses are
              // momentary, no persistent state to push - same reasoning
              // as 31-36 above). 57: rear_power, a real toggle like
              // window_front_power - needs its status pushed the same way
              // (the fix for window_front_power's flicker-to-grey bug
              // applies identically here).
              false, false, false, false,
              id(rear_power).state,
              // 58-59: unused (combined rear up/down are momentary).
              // 60-61: side_lights/low_beam, real relays on the ESP -
              // added to the Main Lights widget alongside the lightbar
              // controls.
              false, false,
              id(side_lights).state,
              id(low_beam).state,
            };

  # NOTE: the request-coil poll used to live here as a modbus_client.read_coils
  # action on a 300ms interval. Root-caused live (via ESPHome's own modbus.cpp
  # queue_pdu(): duplicate frames - same address + identical PDU bytes - get
  # merged into the pending count of whatever entry is already queued instead
  # of being sent fresh, and modbus_client actions aren't marked "continuous"
  # so a stuck/timed-out entry never gets retried, just endlessly refused).
  # Since our read request never changes byte-for-byte, every single poll
  # after the first was silently absorbed rather than retransmitted - it
  # never appeared on the wire again, hence buttons never doing anything.
  # modbus_controller (used below, same as client_10/client_20) marks its
  # polls as continuous and has proven, working retry-on-timeout behaviour
  # already relied on elsewhere in this file - see the binary_sensor block.

# Poll dash's REQUEST coils (offset +100 from the status range above) for
# button requests, via modbus_controller instead of a hand-rolled
# modbus_client.read_coils action - see note above for why. dash's request
# coils are a separate range from the status coils above specifically so
# the status push can't clobber a click before this poll notices it
# (see dash-gui's REQUEST_COIL_OFFSET).
modbus_controller:
  - id: client_dash_requests
    address: 5
    modbus_id: bus_client
    # Was 300ms - halved for snappier window/etc buttons (see conversation).
    # Bus headroom: a 52-coil read+response here is roughly 20-30ms of
    # actual airtime at 9600 baud, and it's no longer competing with the
    # status/register pushes the way it used to (see their own comments
    # above - those were slowed specifically to stop crowding this poll
    # out, and are now on 4s/5s cycles of their own, rarely landing in the
    # same window as this one). If buttons start missing presses again or
    # "Frame already active" refusals show up in the log after flashing,
    # that's the signal this went too far - back off toward 300ms.
    update_interval: 150ms

binary_sensor:
  # Gates every real on/off request coil below against dash_app.py's own
  # restart race: a fresh dash_app.py process starts its whole coil table
  # (both status and request ranges) at False, including e.g. suspension_
  # power's/charger_1's/charger_2's request coils, even when the relays were
  # actually on. Reads False on every fresh restart until dash_app.py has
  # re-learned the real state from our own next status push and written it
  # back in, then sets this True (see dash-gui's COIL_GUI_READY). Every
  # non-momentary coil below checks this before acting, so it ignores the
  # request range entirely during that window instead of treating a reset-
  # to-False as a genuine "turn it off".
  #
  # MUST stay declared FIRST in this file, before every coil it gates
  # (110+): on the batch poll after a restart, when everything resets to
  # False at once, modbus_controller fires each coil's on_state in
  # declaration order (NOT address order - tried moving this coil's own
  # address down to 100 to force it first that way, which broke the merged
  # 110-161 bus read into multiple overlapping requests instead - "Frame
  # already active for 5 with 2 requests pending, refused" on the ESP's own
  # debug log, dash never responding to anything. Reverted the address back
  # to 149, its original contiguous slot, and kept only the YAML declaration
  # moved to the top - untested whether declaration order alone is actually
  # what governs firing order, or whether this needs a different approach
  # entirely if relays still drop after this).
  #
  # This coil originally sat declared where its address (149) put it in the
  # file, i.e. AFTER most of what it gates (110-148) - those coils' on_state
  # ran and read this gate's stale pre-restart value (true) before this
  # coil's own on_state had run to bring it current, so the gate silently
  # did nothing for anything below 149 (worklights, lightbar, windows,
  # chargers, suspension - exactly the relays that kept dropping). Only
  # 150+ (rear doors, diff lock) were ever actually protected.
  - platform: modbus_controller
    modbus_controller_id: client_dash_requests
    id: req_gui_ready
    internal: true
    register_type: coil
    address: 149
    on_state:
      - if:
          condition:
            lambda: 'return x;'
          then:
            - lambda: |-
                if (id(req_worklight_passanger_side).state) id(worklight_passanger_side).turn_on(); else id(worklight_passanger_side).turn_off();
                if (id(req_worklight_drivers_side).state) id(worklight_drivers_side).turn_on(); else id(worklight_drivers_side).turn_off();
                if (id(req_worklight_rear).state) id(worklight_rear).turn_on(); else id(worklight_rear).turn_off();
                if (id(req_worklight_bonnet).state) id(worklight_bonnet).turn_on(); else id(worklight_bonnet).turn_off();
                if (id(req_headlights_auto).state) id(headlights_auto).turn_on(); else id(headlights_auto).turn_off();
                if (id(req_sidelights_auto).state) id(sidelights_auto).turn_on(); else id(sidelights_auto).turn_off();
                if (id(req_service_mode).state) id(service_mode).turn_on(); else id(service_mode).turn_off();
                if (id(req_lightbar_main).state) id(lightbar_main).turn_on(); else id(lightbar_main).turn_off();
                if (id(req_lightbar_inner).state) id(lightbar_inner).turn_on(); else id(lightbar_inner).turn_off();
                if (id(req_lightbar_outer).state) id(lightbar_outer).turn_on(); else id(lightbar_outer).turn_off();
                if (id(req_lightbar_white).state) id(lightbar_white).turn_on(); else id(lightbar_white).turn_off();
                if (id(req_lightbar_amber).state) id(lightbar_amber).turn_on(); else id(lightbar_amber).turn_off();
                if (id(req_lightbar_auto_main).state) id(lightbar_auto_main).turn_on(); else id(lightbar_auto_main).turn_off();
                if (id(req_lightbar_auto_amber).state) id(lightbar_auto_amber).turn_on(); else id(lightbar_auto_amber).turn_off();
                if (id(req_lightbar_auto_white).state) id(lightbar_auto_white).turn_on(); else id(lightbar_auto_white).turn_off();
                if (id(req_window_front_power).state) id(window_front_power).turn_on(); else id(window_front_power).turn_off();
                if (!id(dash_boot_guard_inverter)) { if (id(req_inverter_power).state) id(inverter_power).turn_on(); else id(inverter_power).turn_off(); }
                // charger_1/charger_2/suspension_handbrake/suspension_power/suspension_service
                // deliberately not reapplied here - they're ungated now (see
                // their own on_state comments) and default safely off, so
                // there's nothing to catch up.
                if (id(req_dash_shutdown_request).state) id(dash_shutdown_request).turn_on(); else id(dash_shutdown_request).turn_off();
                if (id(req_low_box).state) id(low_box).turn_on(); else id(low_box).turn_off();
                if (id(req_diff_lock).state) id(diff_lock).turn_on(); else id(diff_lock).turn_off();
                if (id(req_rear_power).state) id(rear_power).turn_on(); else id(rear_power).turn_off();
                if (id(req_side_lights).state) id(side_lights).turn_on(); else id(side_lights).turn_off();
                if (id(req_headlights).state) id(low_beam).turn_on(); else id(low_beam).turn_off();
  - platform: modbus_controller
    modbus_controller_id: client_dash_requests
    id: req_worklight_passanger_side
    internal: true
    register_type: coil
    address: 110
    on_state:
      - lambda: |-
          if (!id(req_gui_ready).state) return;
          if (x) id(worklight_passanger_side).turn_on();
          else id(worklight_passanger_side).turn_off();
  - platform: modbus_controller
    modbus_controller_id: client_dash_requests
    id: req_worklight_drivers_side
    internal: true
    register_type: coil
    address: 111
    on_state:
      - lambda: |-
          if (!id(req_gui_ready).state) return;
          if (x) id(worklight_drivers_side).turn_on();
          else id(worklight_drivers_side).turn_off();
  - platform: modbus_controller
    modbus_controller_id: client_dash_requests
    id: req_worklight_rear
    internal: true
    register_type: coil
    address: 112
    on_state:
      - lambda: |-
          if (!id(req_gui_ready).state) return;
          if (x) id(worklight_rear).turn_on();
          else id(worklight_rear).turn_off();
  - platform: modbus_controller
    modbus_controller_id: client_dash_requests
    id: req_worklight_bonnet
    internal: true
    register_type: coil
    address: 113
    on_state:
      - lambda: |-
          if (!id(req_gui_ready).state) return;
          if (x) id(worklight_bonnet).turn_on();
          else id(worklight_bonnet).turn_off();
  - platform: modbus_controller
    modbus_controller_id: client_dash_requests
    id: req_headlights_auto
    internal: true
    register_type: coil
    address: 114
    # See req_service_mode's comment further down - same single-poll-glitch
    # guard, since this is also one of the five switches Service Mode's
    # save/off/restore cascade touches.
    filters:
      - delayed_on: 400ms
      - delayed_off: 400ms
    on_state:
      - lambda: |-
          if (!id(req_gui_ready).state) return;
          if (x) id(headlights_auto).turn_on();
          else id(headlights_auto).turn_off();
  - platform: modbus_controller
    modbus_controller_id: client_dash_requests
    id: req_sidelights_auto
    internal: true
    register_type: coil
    address: 115
    # Same single-corrupted-poll-cycle protection as req_service_mode above
    # (see the comment there) - the automode coils are the ones directly
    # reported as flapping, so worth guarding whether the corruption lands
    # on their own bit or on service_mode's (which cascades into these too).
    filters:
      - delayed_on: 400ms
      - delayed_off: 400ms
    on_state:
      - lambda: |-
          if (!id(req_gui_ready).state) return;
          if (x) id(sidelights_auto).turn_on();
          else id(sidelights_auto).turn_off();
  - platform: modbus_controller
    modbus_controller_id: client_dash_requests
    id: req_service_mode
    internal: true
    register_type: coil
    address: 116
    # Service Mode's turn_on/off actions save and cascade-restore five other
    # switches (see output.yaml) - by far the largest blast radius of any
    # coil in this range. A single corrupted-but-CRC-passing byte on the
    # shared bus flipping just this one bit for one 300ms poll cycle would
    # fire that whole save/off/restore sequence and self-correct on the next
    # good poll - looking exactly like "the automodes clear themselves, then
    # come back" from the outside. Requiring the change to hold for two poll
    # cycles filters out exactly that single-frame glitch without adding
    # any real delay to a genuine button press.
    filters:
      - delayed_on: 400ms
      - delayed_off: 400ms
    on_state:
      - lambda: |-
          if (!id(req_gui_ready).state) return;
          if (x) id(service_mode).turn_on();
          else id(service_mode).turn_off();
  - platform: modbus_controller
    modbus_controller_id: client_dash_requests
    id: req_lightbar_main
    internal: true
    register_type: coil
    address: 120
    on_state:
      - lambda: |-
          if (!id(req_gui_ready).state) return;
          if (x) id(lightbar_main).turn_on();
          else id(lightbar_main).turn_off();
  - platform: modbus_controller
    modbus_controller_id: client_dash_requests
    id: req_lightbar_inner
    internal: true
    register_type: coil
    address: 121
    on_state:
      - lambda: |-
          if (!id(req_gui_ready).state) return;
          if (x) id(lightbar_inner).turn_on();
          else id(lightbar_inner).turn_off();
  - platform: modbus_controller
    modbus_controller_id: client_dash_requests
    id: req_lightbar_outer
    internal: true
    register_type: coil
    address: 122
    on_state:
      - lambda: |-
          if (!id(req_gui_ready).state) return;
          if (x) id(lightbar_outer).turn_on();
          else id(lightbar_outer).turn_off();
  - platform: modbus_controller
    modbus_controller_id: client_dash_requests
    id: req_lightbar_white
    internal: true
    register_type: coil
    address: 123
    on_state:
      - lambda: |-
          if (!id(req_gui_ready).state) return;
          if (x) id(lightbar_white).turn_on();
          else id(lightbar_white).turn_off();
  - platform: modbus_controller
    modbus_controller_id: client_dash_requests
    id: req_lightbar_amber
    internal: true
    register_type: coil
    address: 124
    on_state:
      - lambda: |-
          if (!id(req_gui_ready).state) return;
          if (x) id(lightbar_amber).turn_on();
          else id(lightbar_amber).turn_off();
  - platform: modbus_controller
    modbus_controller_id: client_dash_requests
    id: req_lightbar_auto_main
    internal: true
    register_type: coil
    address: 125
    # See req_service_mode's comment above - same single-poll-glitch guard.
    filters:
      - delayed_on: 400ms
      - delayed_off: 400ms
    on_state:
      - lambda: |-
          if (!id(req_gui_ready).state) return;
          if (x) id(lightbar_auto_main).turn_on();
          else id(lightbar_auto_main).turn_off();
  - platform: modbus_controller
    modbus_controller_id: client_dash_requests
    id: req_lightbar_auto_amber
    internal: true
    register_type: coil
    address: 126
    filters:
      - delayed_on: 400ms
      - delayed_off: 400ms
    on_state:
      - lambda: |-
          if (!id(req_gui_ready).state) return;
          if (x) id(lightbar_auto_amber).turn_on();
          else id(lightbar_auto_amber).turn_off();
  - platform: modbus_controller
    modbus_controller_id: client_dash_requests
    id: req_lightbar_auto_white
    internal: true
    register_type: coil
    address: 127
    filters:
      - delayed_on: 400ms
      - delayed_off: 400ms
    on_state:
      - lambda: |-
          if (!id(req_gui_ready).state) return;
          if (x) id(lightbar_auto_white).turn_on();
