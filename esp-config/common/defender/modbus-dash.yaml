  - platform: modbus_controller
    modbus_controller_id: client_dash_requests
    id: req_inverter_power
    internal: true
    register_type: coil
    address: 140
    on_state:
      - lambda: |-
          if (id(dash_boot_guard_inverter)) return;
          if (!id(req_gui_ready).state) return;
          if (x) id(inverter_power).turn_on();
          else id(inverter_power).turn_off();
  - platform: modbus_controller
    modbus_controller_id: client_dash_requests
    id: req_charger_1
    internal: true
    register_type: coil
    address: 141
    # No req_gui_ready gate, deliberately - unlike everything else on this
    # bus, chargers/suspension default OFF (restore_mode: DISABLED on the
    # actual switches) and must only ever go on when explicitly commanded,
    # never auto-recovered. A dash restart's reset-to-False can only ever
    # assert the already-safe default here, so there's nothing for the gate
    # to protect against - and gating it was actively wrong: it delayed
    # genuine button presses until gui_ready caught up (the "very
    # unresponsive" symptom) for zero safety benefit.
    on_state:
      - lambda: |-
          if (x) id(charger_1).turn_on();
          else id(charger_1).turn_off();
  - platform: modbus_controller
    modbus_controller_id: client_dash_requests
