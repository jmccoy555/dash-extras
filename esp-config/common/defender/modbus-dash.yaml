  # Rear window requests (153-156) - contiguous right after 152
  # (diff_lock), so these extend the existing merged read automatically,
  # no new bus transaction. Momentary presses, same pattern as the front
  # window on_press entries above.
  - platform: modbus_controller
    modbus_controller_id: client_dash_requests
    id: req_rear_left_up
    internal: true
    register_type: coil
    address: 153
    on_press:
      - lambda: 'id(rear_left_up).press();'
  - platform: modbus_controller
    modbus_controller_id: client_dash_requests
    id: req_rear_left_down
    internal: true
    register_type: coil
    address: 154
    on_press:
