          else id(window_front_power).turn_off();
  - platform: modbus_controller
    modbus_controller_id: client_dash_requests
    id: req_window_driver_up
    internal: true
    register_type: coil
    address: 131
    on_press:
      - lambda: 'id(window_driver_up).press();'
  - platform: modbus_controller
    modbus_controller_id: client_dash_requests
    id: req_window_driver_down
    internal: true
    register_type: coil
    address: 132
    on_press:
