          else id(suspension_power).turn_off();
  - platform: modbus_controller
    modbus_controller_id: client_dash_requests
    id: req_dash_shutdown_request
    internal: true
    register_type: coil
    address: 145
    on_state:
      - lambda: |-
          if (!id(req_gui_ready).state) return;
          if (x) id(dash_shutdown_request).turn_on();
          else id(dash_shutdown_request).turn_off();
  - platform: modbus_controller
    modbus_controller_id: client_dash_requests
    id: req_suspension_service
    internal: true
    register_type: coil
    address: 150
    # No gate - see req_charger_1's comment.
    on_state:
      - lambda: |-
          if (x) id(suspension_service).turn_on();
          else id(suspension_service).turn_off();
  - platform: modbus_controller
    modbus_controller_id: client_dash_requests
    id: req_low_box
    internal: true
    register_type: coil
    address: 151
    on_state:
      - lambda: |-
          if (!id(req_gui_ready).state) return;
          if (x) id(low_box).turn_on();
          else id(low_box).turn_off();
  - platform: modbus_controller
    modbus_controller_id: client_dash_requests
    id: req_diff_lock
    internal: true
    register_type: coil
    address: 152
    on_state:
      - lambda: |-
          if (!id(req_gui_ready).state) return;
          if (x) id(diff_lock).turn_on();
          else id(diff_lock).turn_off();

# Filler entries covering every unused gap address in the request range
# (117-119, 128-129, 137-139, 146-149) - not tied to anything, just closing
# every hole so the whole 110-152 span is contiguous. ESPHome docs:
# "To avoid generating multiple commands ... register_count can be used to
# fill the gaps" - these are the coil equivalent. Without these,
# modbus_controller splits this into 5 separate read commands
