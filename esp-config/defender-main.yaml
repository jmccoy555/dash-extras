text_sensor:
  # Send IP Address
  - platform: wifi_info
    ip_address:
      name: IP Address
      web_server:
        sorting_group_id: sorting_group_system  
  - platform: template
    name: "Uptime" # sprintf(buffer, "%ud %huh %hum %hus", dys, hrs, mnts, dur);
    lambda: |-
      uint32_t dur = id(uptime_sec).state;
      int dys = 0;
      int hrs = 0;
      int mnts = 0;
      int secs = 0;
      if (dur > 86399) {
        dys = trunc(dur / 86400);
        dur = dur - (dys * 86400);
      }
      if (dur > 3599) {
        hrs = trunc(dur / 3600);
        dur = dur - (hrs * 3600);
      }
      if (dur > 59) {
        mnts = trunc(dur / 60);
        secs = dur - (mnts * 60);
      }
      char buffer[17];
      sprintf(buffer, "%ud %huh %hum %hus", dys, hrs, mnts, secs);
      return {buffer};
    icon: mdi:clock-start
    update_interval: 15s
    # state_topic: $device_name/sensor/uptime/state
    web_server:
      sorting_group_id: sorting_group_system
  # # web_server_sorting_weight: 10
  - platform: debug
    device:
      name: "Device Info"
      # state_topic: $device_name/sensor/device/state
      web_server:
        sorting_group_id: sorting_group_system

      # web_server_sorting_weight: 10
    reset_reason:
      name: "Reset Reason"
      # state_topic: $device_name/sensor/reason/state
      web_server:
        sorting_group_id: sorting_group_system
