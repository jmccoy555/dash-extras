esphome:
  name: defender-main
  friendly_name: defender-main
  platformio_options:
    board_build.flash_mode: dio
esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

substitutions:
  device_name: defender-main

packages:
  # wifi: !include common/wifi-wpa.yaml
  # ethernet: !include common/eth-w5500.yaml
  # main: !include common/defender/main.yaml
  # ble-tracker: !include common/ble-tracker-wifi.yaml
  # Re-enabling this caused severe, sustained Modbus RTU frame corruption
  # (constant "Clearing buffer... parse failed", garbled repeating frames)
  # within seconds of boot - almost certainly the per-packet AES decryption
  # of Victron's encrypted BLE advertisements stealing enough CPU time to
  # starve the UART's timing-critical RX handling, unlike the much
  # lighter-weight presence/RSSI BLE tracking that's always running.
  # Confirmed live; do not re-enable without addressing that contention
  # (e.g. a lower-priority BLE task, or moving Victron reporting to dash's
  # own BLE poller instead of the ESP's).
  # victron: !include common/defender/victron.yaml

  gpio-input: !include common/defender/input.yaml
  gpio-output: !include common/defender/output.yaml
  onewire: !include common/defender/one-wire.yaml
  # Split into transport/client/dash so each part of the Modbus setup can
  # be reasoned about (and in principle disabled) independently.
  modbus-transport: !include common/defender/modbus-transport.yaml
  modbus-client: !include common/defender/modbus-client.yaml
  # The ESP is the bus's only master, including of dash - dash runs as a
  # genuine Modbus slave (see the dash-gui project) rather than the ESP
  # exposing a server for dash to poll.
  modbus-dash: !include common/defender/modbus-dash.yaml
  # Initially suspected of corrupting the bus the same way Victron's BLE
  # decryption did (a single response frame repeating in a tight garbage
  # loop, "Clearing buffer... parse failed") and briefly reverted - but
  # restarting dash on its own cleared the symptom, which points at a
  # stuck-retransmission bug in dash's own pymodbus serial handling rather
  # than the ESP's BLE workload actually corrupting the physical bus (see
  # conversation). Re-enabled; if the same symptom recurs and restarting
  # dash does NOT clear it, that would point back at this after all.
  battery-bms: !include common/defender/battery-bms.yaml

i2c:
  - id: bus_a
    sda: 11
    scl: 12
    scan: true
    frequency: 400kHz

mqtt:
  broker: mqtt.mcy.lan
  # discovery: false
  # discovery_prefix: esphome
  reboot_timeout: 0s

# packages:
#   base: !include base.yaml
#   system: !include system.yaml

wifi:
  ap:
    # ssid: ${device_name}
    password: !secret hotspot_password
  domain: .mcy.lan
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: on
  # fallback mechanism: If ESP can't connect to Wi-Fi, switch to AP mode
  # Here, the AP will work as a fallback when the Wi-Fi is not available.
  reboot_timeout: 0s # Keeps trying to reconnect indefinitely
  # power_save_mode: none  # (Optional) Can disable power-saving mode to maintain connection attempts
  on_connect:
    - esp32_ble_tracker.start_scan:
        continuous: true
  # Used to stop_scan here on WiFi disconnect - but WiFi range and driving
  # range aren't the same thing, and losing WiFi (driving away from home)
  # was exactly when fob presence detection matters most. That stop left
  # scanning off until WiFi came back, so the fob's ble_presence sensor
  # (60s timeout) always dropped to OFF once out of range and never
  # recovered until getting back in WiFi range. Scanning now just keeps
  # running once started at the first WiFi connect, regardless of WiFi
  # state after.

#captive_portal:

# Enable logging
logger:
  hardware_uart: USB_SERIAL_JTAG

ota:
  - platform: esphome
    password: !secret ota_password


web_server:
  port: 80
  log: false
  ota: false
  version: 3 #2
  sorting_groups:
    - id: sorting_group_system
      name: "System"
      sorting_weight: 10
    - id: sorting_group_bluetooth
      name: "Bluetooth"
      sorting_weight: 20
#  local: True        

esp32_ble_tracker:
  id: ble_tracker
  scan_parameters:
    continuous: false
  #   interval: 211ms
  #   window: 120ms

